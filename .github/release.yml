# Categories for GitHub's generated release notes.
#
# A pull request is filed by its labels, and lands in the FIRST category below
# whose labels it carries - so the order is a priority rule, not cosmetic. A PR
# labelled both `bug` and `enhancement` shows up under New Features only, never
# twice. The order puts what users care about first and pushes dependency/CI
# noise to the bottom.
#
# The catch-all `*` at the end means an unlabelled PR is still listed instead of
# being dropped silently. PRs merged before these labels existed carry none of
# them and therefore stay under "Other Changes" unless they are labelled
# retroactively.
#
# WHERE THESE LABELS LIVE: on the repository itself, managed directly
# (`gh label list` / `gh label create`) - there is no file that defines them.
# A .github/settings.yml used to list a label set for the probot/settings app,
# but it described a scheme inherited from upstream whose labels had never been
# created here, so installing that app would have replaced the real labels with
# a dead one; it was removed along with the equally obsolete .github/stale.yml.
# Adding a category below therefore means creating the label too, otherwise the
# category silently matches nothing.
#
# Labels applied automatically: Dependabot sets `dependencies` plus a per-
# ecosystem label (`github_actions`, `python`, `javascript`) - .github/
# dependabot.yml declares no explicit labels and relies on those defaults, which
# only work while the labels exist. The stale bot sets `stale` (see
# .github/workflows/github-stale-actions.yml).
changelog:
  categories:
    # `breaking-change` is deliberately kept as a second spelling without a
    # matching label existing: it costs nothing and catches the case where
    # someone reaches for the longer name. `breaking` is the real label.
    - title: "⚠️ Breaking Changes"
      labels: ["breaking", "breaking-change"]
    - title: "🔒 Security"
      labels: ["security"]
    - title: "✨ New Features"
      labels: ["enhancement", "feature"]
    - title: "🐛 Bug Fixes"
      labels: ["bug", "fix"]
    - title: "⚡ Performance"
      labels: ["performance"]
    - title: "♻️ Refactoring"
      labels: ["refactor"]
    - title: "📚 Documentation"
      labels: ["documentation"]
    - title: "🧪 Tests"
      labels: ["test"]
    - title: "📦 Dependencies"
      labels: ["dependencies", "depfu"]
    - title: "🔧 CI / Tooling"
      labels: ["ci", "tooling", "chore", "github_actions"]
    - title: "🧩 Other Changes"
      labels: ["*"]
  exclude:
    labels: ["skip-changelog"]
