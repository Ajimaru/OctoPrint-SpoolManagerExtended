## Documentation could be found here
## https://github.com/actions/stale
##
name: 'Stale and close issues'
on:
  schedule:
    # Each day at 1:30am run the action
    - cron: '30 1 * * *'

# The workflow only marks and closes issues; it never writes to the repository
# contents and never touches pull requests.
permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # These labels must EXIST on the repository to have any effect - the
          # action matches them by name and silently exempts nothing when the
          # name is unknown. The previous list ('status: analysing',
          # 'status: inNextRelease', 'status: inProgress', 'status: wontfix')
          # was inherited from the upstream repository and none of those labels
          # were ever created here, so the exemption was dead: every issue aged
          # out after 90 days regardless of state.
          exempt-issue-labels: 'pinned,help wanted,enhancement,feature'

          days-before-issue-stale: 90
          # Keep the number in this message in sync with days-before-issue-stale
          # above and days-before-issue-close below. It said "30 days" while the
          # threshold was 90, which simply misinformed anyone reading it.
          stale-issue-message: 'This issue has been automatically marked as stale, because it has not had activity in 90 days. It will be closed if no further activity occurs in 10 days.'
          stale-issue-label: 'stale'

          days-before-issue-close: 10
          close-issue-message: 'This issue was closed, because it has been marked as stale for 10 days with no further activity.'
          # Reuses the 'stale' label rather than adding a second bot-only label:
          # the closed state already records that the issue was closed, so a
          # separate 'closedByBot' marker carried no information the timeline
          # did not already have.
          close-issue-label: 'stale'
