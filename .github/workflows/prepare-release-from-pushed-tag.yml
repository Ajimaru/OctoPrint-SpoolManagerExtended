name: Tag pushed - prepare release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # note that these are glob patterns, not regex

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "PrepareRelease" - more would create more runners and we don't need that
  PrepareRelease:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Creating the release and uploading its asset needs write access to contents.
    # The repository default for the workflow token is read-only, which made
    # "gh release create" fail with HTTP 403.
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Check out repository code # this step uses another repo so it just needs a name and "uses"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so --generate-notes can diff against the previous tag

      - name: Check current version against tag # this step is coded directly into this file
        env:
          TAG_ID: ${{ github.ref_name }} # pass this github variable into the script
        run: |
          PLUGIN_VERSION=$(cat setup.py | grep 'plugin_version = "*"' | cut -d '"' -f2)
          echo "Plugin Version in code: $PLUGIN_VERSION"
          if [ "$PLUGIN_VERSION" != "$TAG_ID" ]; then exit 1; fi

      - name: Build ZIP archive
        run: zip -r main.zip * -i '\octoprint_*' 'translations' 'README.md' 'requirements.txt' 'setup.py' 'LICENSE.txt'

      # Release notes come from GitHub's own generator (merged PRs since the previous
      # tag). The milestone-driven generator this workflow used before required a
      # milestone named after the tag and aborted without one.

      - name: List files in the repository for debugging
        run: ls ${{ github.workspace }}

      - name: Create release draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSIONTAG: ${{ github.ref_name }}
        run: |
          gh release create "$VERSIONTAG" --generate-notes --draft --verify-tag --title "Version $VERSIONTAG (draft)"
          gh release upload "$VERSIONTAG" main.zip
