name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: Your idea of the feature, from a user's point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you already tried, or other ways this could be solved.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Mockups, links to other plugins or hardware, related issues, …
