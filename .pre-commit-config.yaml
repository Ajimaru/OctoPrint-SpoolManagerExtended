# Linting and formatting for the SpoolManager plugin.
#
# Mirrors OctoPrint core's tooling: Black + isort + flake8 for Python, Prettier for
# the frontend (same .prettierrc values as OctoPrint core), plus ESLint/stylelint/djlint
# for correctness. The repo-wide reformats each happened in one dedicated commit - both
# are listed in .git-blame-ignore-revs so `git blame` skips them.
#
# Setup:  pre-commit install
# Manual: pre-commit run --all-files

exclude: |
  (?x)^(
      3rdPartySoftware/.*|
      octoprint_SpoolManager/static/js/quill\.min\.js|
      octoprint_SpoolManager/static/js/tinycolor\.min\.js|
      octoprint_SpoolManager/static/css/quill\.snow\.css|
      translations/.*|
      testdata/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # configuration lives in setup.cfg
        types: [python]

  - repo: https://github.com/djlint/djLint
    rev: v1.43.1
    hooks:
      - id: djlint-jinja
        files: \.jinja2$
        args: ["--lint"]

  # Frontend linters run from the local node_modules (npm install once).
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        files: ^octoprint_SpoolManager/static/js/.*\.js$
        pass_filenames: true

      - id: stylelint
        name: stylelint
        entry: npx --no-install stylelint
        language: system
        files: ^octoprint_SpoolManager/static/.*\.(css|less)$
        pass_filenames: true

      # --check instead of --write: the hook reports, it never rewrites files
      # behind the author's back. Run `npm run format` to apply.
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --check
        language: system
        files: ^octoprint_SpoolManager/static/.*\.(js|css|less)$
        exclude: \.min\.js$|quill\.snow\.css$
        pass_filenames: true
