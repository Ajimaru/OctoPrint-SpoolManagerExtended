[flake8]
# Aligned with OctoPrint core's linting setup (Black + isort + flake8).
# Formatting-related codes stay disabled until the repo-wide Black reformat
# happens in a separate step, so linting produces no formatting churn.
max-line-length = 120
extend-ignore =
    # Black compatibility
    E203,
    W503,
    # Whitespace/indentation codes: the code base is tab-indented and not yet
    # Black-formatted. Enabling these now would bury real findings under ~1500
    # style hits. Re-enable together with the repo-wide Black reformat.
    E101,
    W191,
    E1,
    E2,
    E3,
    E501,
    W291,
    W293,
    W391,
    # Comment formatting ("##" block comments are used throughout on purpose)
    E265,
    E266,
    E262,
    E402
exclude =
    .git,
    __pycache__,
    build,
    dist,
    node_modules,
    translations,
    3rdPartySoftware,
    *.egg-info,
    .venv,
    .pytest_cache
